[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "asthral-engine"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "Pillow>=10.4,<13"]
[project.optional-dependencies]
public_demo = ["psutil==7.2.2"]
personal = ["argon2-cffi==25.1.0", "argon2-cffi-bindings==26.1.0"]
voice = ["vosk==0.3.45"]
integration = ["httpx>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov==7.1.0", "numpy>=1.26,<3"]
skinguard = ["onnxruntime>=1.20,<2"]
vision = ["mediapipe==0.10.21", "numpy==1.26.4", "opencv-contrib-python==4.11.0.86", "torch==2.5.1", "torchvision==0.20.1"]
[tool.setuptools.packages.find]
include = ["vigile*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
vigile = ["clinical_knowledge/*.json", "web/*", "voice_assets/*.ps1", "voice_assets/*.json"]
