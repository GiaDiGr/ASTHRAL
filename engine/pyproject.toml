[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vigile-engine"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
personal = ["argon2-cffi==25.1.0", "argon2-cffi-bindings==26.1.0"]
voice = ["vosk==0.3.45"]
integration = ["httpx>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["vigile*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
vigile = ["clinical_knowledge/*.json", "web/*", "voice_assets/*.ps1", "voice_assets/*.json"]
